<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Bot Arşivi</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #131b2e;
      --card-border: rgba(255, 255, 255, 0.08);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-gradient: linear-gradient(135deg, #38bdf8 0%, #2563eb 100%);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 14px; padding-bottom: 35px; }

    .app-header-center {
      position: relative;
      display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 8px 0 16px 0;
    }
    .main-avatar-wrap { position: relative; margin-bottom: 10px; }
    .main-avatar {
      width: 74px; height: 74px; border-radius: 50%; object-fit: cover;
      border: 3px solid #38bdf8; box-shadow: 0 0 25px rgba(56, 189, 248, 0.35); background: #1e293b; display: block;
    }
    .app-header-center h1 {
      font-family: 'Outfit', sans-serif; font-size: 25px; font-weight: 800;
      background: linear-gradient(135deg, #ffffff 40%, #93c5fd 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 4px;
    }
    .app-header-center p { font-size: 12.5px; color: var(--text-muted); font-weight: 500; max-width: 290px; line-height: 1.4; margin-bottom: 10px; }

    .search-box { position: sticky; top: 0; background: var(--bg); padding: 8px 0 10px 0; z-index: 10; }
    .search-wrapper { position: relative; width: 100%; }
    .search-wrapper input {
      width: 100%; padding: 12px 16px 12px 42px; border-radius: 14px; border: 1px solid var(--card-border);
      background: var(--card-bg); color: var(--text); font-size: 14px; outline: none; transition: 0.2s;
    }
    .search-wrapper input:focus { border-color: var(--accent); }
    .search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); opacity: 0.5; font-size: 15px; }

    .category-scroll { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 6px; scrollbar-width: none; }
    .category-scroll::-webkit-scrollbar { display: none; }
    .cat-btn {
      display: flex; align-items: center; gap: 6px; background: var(--card-bg); border: 1px solid var(--card-border);
      padding: 8px 14px; border-radius: 12px; font-size: 13px; font-weight: 600; color: #cbd5e1; white-space: nowrap; cursor: pointer; transition: 0.2s;
    }
    .cat-btn.active { background: var(--accent-gradient); color: #ffffff; border-color: transparent; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3); }

    .tags-container { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 12px; scrollbar-width: none; }
    .tags-container::-webkit-scrollbar { display: none; }
    .tag-chip {
      background: rgba(255,255,255,0.04); padding: 5px 11px; border-radius: 16px; font-size: 11.5px; font-weight: 500;
      white-space: nowrap; cursor: pointer; color: var(--text-muted); border: 1px solid rgba(255,255,255,0.03); transition: 0.2s;
    }
    .tag-chip.active { background: rgba(56, 189, 248, 0.15); color: #38bdf8; border-color: rgba(56, 189, 248, 0.3); font-weight: 600; }

    .bot-list { display: flex; flex-direction: column; gap: 14px; }
    .load-more-wrap { text-align: center; margin: 18px 0 8px; }
    .btn-load-more { border: 1px solid rgba(56, 189, 248, 0.25); background: rgba(56, 189, 248, 0.10); color: #7dd3fc; padding: 12px 24px; border-radius: 12px; font-family: 'Outfit', sans-serif; font-size: 14px; font-weight: 700; cursor: pointer; }
    .btn-load-more:active { transform: scale(0.98); }

    /* Welcome screen */
    #welcomeScreen{position:fixed;inset:0;z-index:9999;overflow:hidden;background:radial-gradient(circle at 50% 42%,rgba(37,99,235,.16),transparent 34%),radial-gradient(circle at 15% 20%,rgba(56,189,248,.07),transparent 26%),#070b14;display:flex;align-items:center;justify-content:center;padding:24px;transition:opacity .35s ease,visibility .35s ease}
    #welcomeScreen.hidden{opacity:0;visibility:hidden;pointer-events:none}
    .welcome-scene{position:relative;width:min(520px,100%);height:min(700px,92vh);display:flex;align-items:center;justify-content:center}
    .welcome-grid{position:absolute;inset:5% -20% 8%;opacity:.24;background-image:linear-gradient(rgba(96,165,250,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(96,165,250,.08) 1px,transparent 1px);background-size:42px 42px;mask-image:radial-gradient(circle,#000 0%,transparent 72%);-webkit-mask-image:radial-gradient(circle,#000 0%,transparent 72%)}
    .welcome-orbit{position:absolute;width:84%;aspect-ratio:1;border:1px solid rgba(96,165,250,.13);border-radius:50%;box-shadow:0 0 70px rgba(37,99,235,.08)}
    .welcome-orbit.orbit-2{width:64%;transform:rotate(42deg);border-color:rgba(56,189,248,.09)}
    .welcome-core{position:relative;z-index:4;width:132px;height:132px;border-radius:50%;display:grid;place-items:center;background:rgba(15,23,42,.92);border:1px solid rgba(147,197,253,.25);box-shadow:0 0 0 10px rgba(37,99,235,.035),0 18px 55px rgba(0,0,0,.42),0 0 70px rgba(37,99,235,.12);animation:coreFloat 4.8s ease-in-out infinite}
    .welcome-logo{width:76px;height:76px;object-fit:contain;filter:drop-shadow(0 7px 18px rgba(37,99,235,.22))}
    .welcome-bot{position:absolute;z-index:3;width:48px;height:48px;border-radius:50%;object-fit:cover;background:#111827;border:2px solid rgba(148,163,184,.20);box-shadow:0 10px 26px rgba(0,0,0,.32);animation:botFloat 5.5s ease-in-out infinite}
    .welcome-bot:nth-of-type(2n){animation-duration:6.7s}.welcome-bot:nth-of-type(3n){animation-duration:4.9s}.welcome-bot:nth-of-type(4n){animation-duration:7.2s}
    .bot-1{top:10%;left:26%}.bot-2{top:18%;right:18%;width:40px;height:40px}.bot-3{top:36%;left:5%;width:42px;height:42px}.bot-4{top:35%;right:4%;width:54px;height:54px}.bot-5{bottom:30%;left:10%;width:38px;height:38px}.bot-6{bottom:18%;right:14%;width:46px;height:46px}.bot-7{bottom:10%;left:31%;width:43px;height:43px}.bot-8{top:51%;right:17%;width:34px;height:34px}
    .welcome-copy{position:absolute;z-index:7;top:7%;left:50%;transform:translateX(-50%);text-align:center;width:92%;pointer-events:none}
    .welcome-bubble{display:inline-block;padding:10px 17px;border:1px solid rgba(148,163,184,.16);border-radius:18px;background:rgba(15,23,42,.82);backdrop-filter:blur(12px);color:#f8fafc;font-family:'Outfit',sans-serif;font-size:18px;font-weight:700;box-shadow:0 12px 35px rgba(0,0,0,.22)}
    .welcome-actions{position:absolute;z-index:8;bottom:6%;left:50%;transform:translateX(-50%);width:min(250px,75%)}
    .welcome-start{width:100%;border:1px solid rgba(147,197,253,.18);border-radius:15px;padding:14px 20px;background:linear-gradient(135deg,#2563eb,#3b82f6);color:#fff;font-family:'Outfit',sans-serif;font-size:16px;font-weight:800;cursor:pointer;box-shadow:0 10px 30px rgba(37,99,235,.24)}
    @keyframes coreFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
    @keyframes botFloat{0%,100%{transform:translate3d(0,0,0)}50%{transform:translate3d(3px,-6px,0)}}

    .bot-card {
      position: relative;
      background: var(--card-bg); border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 10px;
      border: 1px solid var(--card-border); box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
    }

    .bot-rank {
      position: absolute;
      top: 12px;
      left: 12px;
      min-width: 26px;
      height: 26px;
      padding: 0 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 9px;
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.22);
      color: #7dd3fc;
      font-family: 'Outfit', sans-serif;
      font-size: 11px;
      font-weight: 800;
      z-index: 2;
    }

    .card-top { padding-left: 34px; }
    .card-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .bot-identity { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .bot-pfp { width: 46px; height: 46px; border-radius: 50%; object-fit: cover; border: 2px solid rgba(255, 255, 255, 0.1); background: #1e293b; flex-shrink: 0; }

    .bot-title { font-family: 'Outfit', sans-serif; font-size: 16.5px; font-weight: 700; color: #fff; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .bot-username { font-size: 12.5px; color: var(--accent); margin-top: 2px; font-weight: 500; }
    .bot-desc { font-size: 13.5px; color: #cbd5e1; line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .bot-desc.expanded { -webkit-line-clamp: unset; }
    .badges-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 2px; }
    .feature-badge { font-size: 11px; padding: 4px 8px; border-radius: 8px; background: rgba(255,255,255,0.06); color: var(--text-muted); font-weight: 500; }
    
    .card-footer { display: flex; gap: 8px; margin-top: 4px; }
    .btn-open { flex: 1; background: var(--accent-gradient); color: #ffffff; text-align: center; padding: 12px; border-radius: 12px; font-weight: 700; font-size: 14px; text-decoration: none; display: block; box-shadow: 0 4px 14px rgba(37, 99, 235, 0.25); }

    .bot-modal {
      position: fixed; inset: 0; z-index: 1000; display: none; align-items: flex-end; justify-content: center;
      background: rgba(0,0,0,.72); backdrop-filter: blur(7px); -webkit-backdrop-filter: blur(7px);
      padding: 12px;
    }
    .bot-modal.show { display: flex; }
    .bot-modal-card {
      width: 100%; max-width: 520px; max-height: 88vh; overflow-y: auto;
      background: #121a2b; border: 1px solid rgba(255,255,255,.10); border-radius: 24px 24px 18px 18px;
      box-shadow: 0 -10px 45px rgba(0,0,0,.45); padding: 20px; position: relative;
      animation: modalUp .22s ease-out;
    }
    @keyframes modalUp { from { transform: translateY(25px); opacity: .5; } to { transform: translateY(0); opacity: 1; } }
    .modal-close {
      position: absolute; top: 12px; right: 12px; width: 36px; height: 36px; border-radius: 50%;
      border: 1px solid rgba(255,255,255,.10); background: rgba(255,255,255,.07); color: #fff;
      font-size: 22px; line-height: 1; cursor: pointer;
    }
    .modal-head { display: flex; align-items: center; gap: 14px; padding-right: 42px; }
    .modal-avatar { width: 70px; height: 70px; border-radius: 50%; object-fit: cover; border: 2px solid rgba(56,189,248,.45); background: #1e293b; flex-shrink: 0; }
    .modal-title { font-family: 'Outfit', sans-serif; font-size: 22px; font-weight: 800; color: #fff; line-height: 1.15; }
    .modal-username { margin-top: 4px; color: #38bdf8; font-size: 13px; }
    .modal-desc { margin-top: 18px; color: #d7deea; font-size: 14px; line-height: 1.6; white-space: pre-wrap; overflow-wrap: anywhere; }
    .modal-section-title { margin-top: 18px; margin-bottom: 9px; color: #94a3b8; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; }
    .modal-info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .modal-info { background: rgba(255,255,255,.045); border: 1px solid rgba(255,255,255,.06); border-radius: 12px; padding: 10px 12px; min-width: 0; }
    .modal-info-label { color: #7f8da3; font-size: 10px; }
    .modal-info-value { color: #f8fafc; font-size: 13px; font-weight: 600; margin-top: 3px; overflow-wrap: anywhere; }
    .modal-tags { display: flex; gap: 6px; flex-wrap: wrap; }
    .modal-tag { background: rgba(56,189,248,.09); border: 1px solid rgba(56,189,248,.16); color: #9ddcff; padding: 5px 9px; border-radius: 10px; font-size: 11px; }
    .modal-start { display: block; width: 100%; margin-top: 18px; background: var(--accent-gradient); color: #fff; text-align: center; padding: 13px; border-radius: 13px; font-family: 'Outfit', sans-serif; font-size: 15px; font-weight: 700; text-decoration: none; }
    .bot-card { cursor: pointer; }
    .card-footer, .badges-row { cursor: default; }
  </style>
</head>
<body>
  <div id="welcomeScreen">
    <div class="welcome-scene">
      <div class="welcome-grid"></div>
      <div class="welcome-orbit"></div>
      <div class="welcome-orbit orbit-2"></div>
      <div class="welcome-copy"><div class="welcome-bubble">Başlayalım mı?</div></div>
      <img class="welcome-bot bot-1" src="https://t.me/i/userpic/320/botfather.jpg" alt="">
      <img class="welcome-bot bot-2" src="https://t.me/i/userpic/320/missrose_bot.jpg" alt="">
      <img class="welcome-bot bot-3" src="https://t.me/i/userpic/320/hamster_kombat_bot.jpg" alt="">
      <img class="welcome-bot bot-4" src="https://t.me/i/userpic/320/toncoin_bot.jpg" alt="">
      <img class="welcome-bot bot-5" src="https://t.me/i/userpic/320/downloader_bot.jpg" alt="">
      <img class="welcome-bot bot-6" src="https://t.me/i/userpic/320/rose.jpg" alt="">
      <img class="welcome-bot bot-7" src="https://t.me/i/userpic/320/bot.jpg" alt="">
      <img class="welcome-bot bot-8" src="https://t.me/i/userpic/320/telegram.jpg" alt="">
      <div class="welcome-core">
        <img class="welcome-logo" src="https://upload.wikimedia.org/wikipedia/commons/8/82/Telegram_logo.svg" alt="Telegram">
      </div>
      <div class="welcome-actions"><button class="welcome-start" id="welcomeStart">Başla</button></div>
    </div>
  </div>


  <div class="app-header-center">
    <div class="main-avatar-wrap">
      <img src="https://t.me/i/userpic/320/Botarsivibot.jpg" onerror="this.onerror=null; this.src='https://api.dicebear.com/7.x/bottts/svg?seed=BotArsivi&backgroundColor=0284c7';" class="main-avatar" alt="Bot Arşivi">
    </div>
    <h1>Bot Arşivi</h1>
    <p>Telegram'ın en kullanışlı botlarını keşfet, filtrele ve anında başlat</p>

  </div>

  <div class="search-box">
    <div class="search-wrapper">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" placeholder="Bot adı veya özellik ara...">
    </div>
  </div>

  <div class="category-scroll">
    <div class="cat-btn active" onclick="setCategory('', this)">✨ Tümü</div>
    <div class="cat-btn" onclick="setCategory('müzik', this)">🎵 Müzik & Ses</div>
    <div class="cat-btn" onclick="setCategory('ai', this)">🤖 Yapay Zeka</div>
    <div class="cat-btn" onclick="setCategory('indirici', this)">📥 İndiriciler</div>
    <div class="cat-btn" onclick="setCategory('araçlar', this)">🛠️ Araçlar & Dosya</div>
    <div class="cat-btn" onclick="setCategory('oyun', this)">🎮 Oyun & Eğlence</div>
    <div class="cat-btn" onclick="setCategory('finans', this)">📈 Finans & Kripto</div>
    <div class="cat-btn" onclick="setCategory('grup', this)">🛡️ Grup Yönetimi</div>
  </div>

  <div class="tags-container" id="tagsContainer"></div>
  <div class="bot-list" id="botList">
    <div style="text-align: center; color: var(--text-muted); padding: 25px;">Yükleniyor...</div>
  </div>
  <div class="load-more-wrap" id="loadMoreWrap" style="display:none;"></div>


  <div class="bot-modal" id="botModal" onclick="closeBotDetail(event)">
    <div class="bot-modal-card" onclick="event.stopPropagation()">
      <button class="modal-close" type="button" onclick="closeBotDetail()" aria-label="Kapat">×</button>
      <div id="botModalContent"></div>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) { tg.expand(); tg.ready(); }
    let activeTag = "";
    let activeCategory = "";
    let allBots = [];
    let visibleCount = 100;
    const PAGE_SIZE = 100;


    const welcomeScreen = document.getElementById('welcomeScreen');
    const welcomeStart = document.getElementById('welcomeStart');
    welcomeStart.addEventListener('click', () => welcomeScreen.classList.add('hidden'));
    document.querySelectorAll('.welcome-bot').forEach(img => {
      img.addEventListener('error', () => { img.style.opacity = '0'; }, {once:true});
    });

    async function fetchBots(search = "", tag = "") {
      try {
        const queryTag = tag || activeCategory;
        const res = await fetch(`/api/bots?search=${encodeURIComponent(search)}&tag=${encodeURIComponent(queryTag)}`);
        if (!res.ok) throw new Error(`API ${res.status}`);
        const response = await res.json();

        // API hem eski formatta [] hem de yeni formatta { bots: [], total: ... } dönebilir.
        allBots = Array.isArray(response)
          ? response
          : (Array.isArray(response?.bots) ? response.bots : []);

        visibleCount = PAGE_SIZE;

        if (!search && !tag && !activeCategory) {
          renderTags(allBots);
        }

        renderBots(allBots.slice(0, visibleCount));
        renderLoadMore();
      } catch(e) {
        console.error('Bot verileri alınamadı:', e);
        document.getElementById('botList').innerHTML = '<div style="text-align:center; color:var(--text-muted); padding:30px;">Veriler yüklenemedi.</div>';
        document.getElementById('loadMoreWrap').style.display = 'none';
      }
    }

    function renderLoadMore() {
      const wrap = document.getElementById('loadMoreWrap');
      if (visibleCount >= allBots.length) {
        wrap.innerHTML = '';
        wrap.style.display = 'none';
        return;
      }

      const remaining = allBots.length - visibleCount;
      const nextCount = Math.min(PAGE_SIZE, remaining);
      wrap.style.display = 'block';
      wrap.innerHTML = `<button class="btn-load-more" onclick="loadMoreBots()">Daha Fazla Bot <span style="opacity:.7;">(+${nextCount})</span></button>`;
    }

    function loadMoreBots() {
      visibleCount = Math.min(visibleCount + PAGE_SIZE, allBots.length);
      renderBots(allBots.slice(0, visibleCount));
      renderLoadMore();
    }

    function renderTags(botData) {
      const tagSet = new Set();
      botData.forEach(b => {
        if (b.tags) {
          b.tags.split(' ').forEach(t => { if (t.startsWith('#')) tagSet.add(t.replace('#', '')); });
        }
      });
      const container = document.getElementById('tagsContainer');
      let html = '';
      Array.from(tagSet).slice(0, 15).forEach(t => {
        html += `<div class="tag-chip ${activeTag === t ? "active" : ""}" onclick="filterByTag('${t}')">#${t}</div>`;
      });
      container.innerHTML = html;
    }

    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function renderBots(botList) {
      const container = document.getElementById('botList');
      if (!botList.length) {
        container.innerHTML = '<div style="text-align:center; color:var(--text-muted); padding:30px;">Bu kategoride eşleşen bot bulunamadı.</div>';
        return;
      }
      container.innerHTML = botList.map((b, index) => {
        const tgAvatar = `https://t.me/i/userpic/320/${encodeURIComponent(b.username)}.jpg`;
        const fallbackAvatar = `https://api.dicebear.com/7.x/identicon/svg?seed=${encodeURIComponent(b.username)}`;
        const rank = index + 1;
        const username = escapeHtml(b.username);
        const name = escapeHtml(b.name || b.username);
        const description = escapeHtml(b.description || 'Açıklama bulunmuyor.');
        const tags = b.tags ? b.tags.split(' ').slice(0, 3).map(t => `<span class="feature-badge">${escapeHtml(t)}</span>`).join('') : '';

        return `
          <div class="bot-card" id="card-${username}" onclick="openBotDetail('${username}')">
            <div class="bot-rank">${rank}</div>
            <div class="card-top">
              <div class="bot-identity">
                <img src="${tgAvatar}" class="bot-pfp" onerror="this.onerror=null; this.src='${fallbackAvatar}';" alt="${name}">
                <div style="min-width:0;">
                  <div class="bot-title">${name}</div>
                  <div class="bot-username">@${username}</div>
                </div>
              </div>
            </div>
            <div class="bot-desc">${description}</div>
            <div class="badges-row">
              ${b.supports_inline ? '<span class="feature-badge">⚡ Satır İçi</span>' : ''}
              ${b.supports_groups ? '<span class="feature-badge">👥 Grup</span>' : ''}
              ${tags}
            </div>
            <div class="card-footer" onclick="event.stopPropagation()">
              <a href="https://t.me/${username}?start=botarsivi" class="btn-open" target="_blank">Botu Başlat</a>
            </div>
          </div>
        `;
      }).join('');
    }

    function openBotDetail(username) {
      const bot = allBots.find(b => String(b.username).toLowerCase() === String(username).toLowerCase());
      if (!bot) return;

      const modal = document.getElementById('botModal');
      const content = document.getElementById('botModalContent');
      const avatar = bot.avatar_url || `https://t.me/i/userpic/320/${encodeURIComponent(bot.username)}.jpg`;
      const fallback = `https://api.dicebear.com/7.x/identicon/svg?seed=${encodeURIComponent(bot.username)}`;
      const tags = bot.tags ? bot.tags.split(' ').filter(Boolean).slice(0, 12) : [];
      if (bot.niche && !tags.length) tags.push(`#${bot.niche}`);

      const info = [
        ['Kategori', bot.niche || 'Belirtilmemiş'],
        ['Stars', bot.stars ?? '—'],
        ['Stars seviyesi', bot.stars_level ?? '—'],
        ['Aylık kullanıcı', bot.mau ?? '—'],
        ['Popülerlik sırası', bot.popular_rank ?? '—'],
        ['Büyüme', bot.growth_pct == null ? '—' : `${bot.growth_pct}%`]
      ];

      content.innerHTML = `
        <div class="modal-head">
          <img class="modal-avatar" src="${escapeHtml(avatar)}" onerror="this.onerror=null;this.src='${fallback}';" alt="${escapeHtml(bot.name || bot.username)}">
          <div style="min-width:0;">
            <div class="modal-title">${escapeHtml(bot.name || bot.username)}</div>
            <div class="modal-username">@${escapeHtml(bot.username)}</div>
          </div>
        </div>
        <div class="modal-desc">${escapeHtml(bot.description || 'Açıklama bulunmuyor.')}</div>
        <div class="modal-section-title">Bot bilgileri</div>
        <div class="modal-info-grid">
          ${info.map(([label, value]) => `
            <div class="modal-info">
              <div class="modal-info-label">${escapeHtml(label)}</div>
              <div class="modal-info-value">${escapeHtml(value)}</div>
            </div>`).join('')}
        </div>
        ${tags.length ? `
          <div class="modal-section-title">Etiketler</div>
          <div class="modal-tags">${tags.map(t => `<span class="modal-tag">${escapeHtml(t)}</span>`).join('')}</div>
        ` : ''}
        <a class="modal-start" href="https://t.me/${encodeURIComponent(bot.username)}?start=botarsivi" target="_blank">Botu Başlat →</a>
      `;

      modal.classList.add('show');
      document.body.style.overflow = 'hidden';
    }

    function closeBotDetail(event) {
      if (event && event.target && event.target.id !== 'botModal') return;
      document.getElementById('botModal').classList.remove('show');
      document.body.style.overflow = '';
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeBotDetail();
    });

    function setCategory(cat, el) {
      document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
      el.classList.add('active');
      activeCategory = cat;
      activeTag = "";
      document.querySelectorAll('.tag-chip').forEach(c => c.classList.remove('active'));
      fetchBots(document.getElementById('searchInput').value, cat);
    }

    function filterByTag(tag) {
      activeTag = (activeTag === tag) ? "" : tag;
      document.querySelectorAll('.tag-chip').forEach(c => { c.classList.toggle('active', c.innerText === `#${tag}`); });
      fetchBots(document.getElementById('searchInput').value, activeTag || activeCategory);
    }

    let timeout = null;
    document.getElementById('searchInput').addEventListener('input', (e) => {
      clearTimeout(timeout);
      timeout = setTimeout(() => fetchBots(e.target.value, activeTag || activeCategory), 300);
    });

    fetchBots();
  </script>
</body>
</html>
